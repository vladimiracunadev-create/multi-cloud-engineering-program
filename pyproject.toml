[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "multicloud-engineering-program"
version = "1.0.0"
description = "Programa educativo en español: cloud engineering de cero a nivel experto"
requires-python = ">=3.11"
license = {text = "MIT"}

[project.scripts]
multicloud-program = "multicloud_program.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
