name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "classes/**"
      - "curriculum/**"
      - "scripts/generate_site.py"
      - "scripts/validate_site.py"
      - "scripts/validate_pages.py"
      - "pyproject.toml"
      - "requirements-site.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install generator
        run: python -m pip install ".[site]"
      - name: Generate learning portal
        run: python scripts/generate_site.py
      - name: Validate Pages artifact
        run: python scripts/validate_site.py
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify published site
        run: python scripts/validate_pages.py --url "${{ steps.deployment.outputs.page_url }}" --attempts 12 --delay 10
