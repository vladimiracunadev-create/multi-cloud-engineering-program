name: GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "classes/**"
      - "curriculum/**"
      - "scripts/generate_site.py"
      - "scripts/validate_site.py"
      - "pyproject.toml"
      - "requirements-site.txt"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install generator
        run: python -m pip install ".[site]"
      - name: Generate learning portal
        run: python scripts/generate_site.py
      - name: Validate Pages artifact
        run: python scripts/validate_site.py
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
