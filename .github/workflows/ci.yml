name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Curriculum and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install site and manual dependencies
        run: python -m pip install ".[site,manual]"
      - name: Validate curriculum
        run: python scripts/validate_repository.py --strict
      - name: Verify source registry
        # Offline y determinista a proposito: la red vive en refresh-sources,
        # que es manual. Un gate que falla por causas ajenas al cambio se ignora.
        run: python scripts/verify-sources
      - name: Build and validate site
        run: |
          python scripts/generate_site.py
          python scripts/validate_site.py
      - name: Validate complete manual
        run: python scripts/validate_manual.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q src scripts tests classes

  compatibility:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e .
      - name: Verify CLI and repository
        run: |
          multicloud-program catalog
          python scripts/validate_repository.py --strict
          python -m unittest discover -s tests -v

  summary:
    name: Quality gate
    if: always()
    needs: [validate, compatibility]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job
        run: |
          test "${{ needs.validate.result }}" = "success"
          test "${{ needs.compatibility.result }}" = "success"
