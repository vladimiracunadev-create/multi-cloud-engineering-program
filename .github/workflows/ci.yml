name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Curriculum and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install site dependencies
        run: python -m pip install ".[site]"
      - name: Validate curriculum
        run: python scripts/validate_repository.py --strict
      - name: Build and validate site
        run: |
          python scripts/generate_site.py
          python scripts/validate_site.py
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Compile Python
        run: python -m compileall -q src scripts tests classes

  compatibility:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install package
        run: python -m pip install -e .
      - name: Verify CLI and repository
        run: |
          multicloud-program catalog --part 00
          python scripts/validate_repository.py --strict
          python -m unittest discover -s tests -v

  summary:
    name: Quality gate
    if: always()
    needs: [validate, compatibility]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job
        run: |
          test "${{ needs.validate.result }}" = "success"
          test "${{ needs.compatibility.result }}" = "success"
