name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python:
    name: Dependency and code audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install audit tools
        run: python -m pip install pip-audit bandit ".[site]"
      - name: Audit dependencies
        run: pip-audit -r requirements-site.txt
      - name: Static security scan
        run: bandit -r src scripts -ll
      - name: IaC policy scan
        run: |
          python -m pip install checkov
          checkov -d infrastructure --quiet --soft-fail

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@961680e5305a30eb575f3ddf6bb6b2e265b68f0a # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
